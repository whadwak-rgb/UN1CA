name: Build Isolated One UI ROM

on:
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set Up Linux Tools
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc

    - name: Run Single Target Build
      run: |
        chmod +x build.sh
        ./build.sh m52xq

    - name: Save Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: OneUI-M52-CustomROM
        path: out/*.zip
